# Name: mfd-mono
# Description: Port of the mfd-mono Neovim palette to Kitty

# Core window colors
foreground            #FFFFFF
background            #000000
selection_foreground  #D0D0D8
selection_background  #1A1A22

# Cursor customization
# Neovim cursor (#101014) is used for cursorline; we use 'bright' for the block.
cursor                #F0F0FF
cursor_text_color     #08080C

# URL underline color when hovering with the mouse
url_color             #F0F0FF

# Window borders (using border and dim)
active_border_color   #2A2A32
inactive_border_color #08080C

# Tab bar styles (using float_bg, visual, and dim)
active_tab_foreground   #F0F0FF
active_tab_background   #1A1A22
inactive_tab_foreground #383840
inactive_tab_background #0C0C10

# Terminal colors (16 ANSI colors)

# Black (bg / dim)
color0 #08080C
color8 #282830

# Red (mapped to mid-gray for legibility)
color1 #909098
color9 #D0D0D8

# Green
color2 #909098
color10 #D0D0D8

# Yellow
color3 #909098
color11 #D0D0D8

# Blue
color4 #909098
color12 #D0D0D8

# Magenta
color5 #909098
color13 #D0D0D8

# Cyan
color6 #909098
color14 #D0D0D8

# White (fg / bright)
color7  #D0D0D8
color15 #F0F0FF
